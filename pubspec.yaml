name: anonnote
description: "AnonNote - Anonymous Note Taking App"
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  firebase_auth: ^6.1.4

  # Editor
  flutter_quill: 11.5.0

  # Storage / Device
  shared_preferences: ^2.2.0
  connectivity_plus: ^6.1.4
  file_picker: ^8.1.2

  # Export / Share
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^10.0.3

  # Web support
  universal_html: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    
  fonts:
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai-Regular.ttf
        - asset: assets/fonts/NotoSansThai-Bold.ttf
          weight: 700

# ✅ ต้องอยู่นอก flutter:
flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

# ✅ splash screen (กันโดน reject)
flutter_native_splash:
  color: "#0f172a"
  image: assets/logo.png
  android: true
  ios: true